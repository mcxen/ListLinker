name: Build All Platforms

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.2"
  ANDROID_SIGNING_CERT_SHA256: "f22b4082a87e186037fee3ccfafd502a030348ce88c077d70963e27f179066f2"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android
            os: ubuntu-latest
            setup: ""
            build-cmd: flutter build apk --release
            artifact-path: build/app/outputs/flutter-apk/*.apk

          - name: ios
            os: macos-latest
            setup: ""
            build-cmd: flutter build ios --no-codesign --release
            artifact-path: build/ios/iphoneos/Runner.app

          - name: macos
            os: macos-latest
            setup: ""
            build-cmd: flutter build macos --release
            artifact-path: build/macos/ListLinker-macOS.zip

          - name: windows
            os: windows-latest
            setup: ""
            build-cmd: flutter build windows --release
            artifact-path: build/windows/x64/runner/Release/listlinker-windows.zip

          - name: linux
            os: ubuntu-latest
            setup: |
              sudo apt-get update -y
              sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libmpv-dev
            build-cmd: flutter build linux --release
            artifact-path: build/linux/x64/release/bundle

          - name: web
            os: ubuntu-latest
            setup: ""
            build-cmd: flutter build web --release
            artifact-path: build/web

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK 36
        if: matrix.name == 'android'
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" 2>&1 || true'

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Run flutter doctor
        run: |
          flutter config --no-analytics
          flutter doctor

      - name: Ensure Rosetta is available
        if: matrix.name == 'macos' && runner.arch == 'ARM64'
        run: sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license

      - name: Install system dependencies
        if: matrix.setup != ''
        run: ${{ matrix.setup }}

      - name: Get Flutter packages
        run: flutter pub get

      - name: Generate database code
        run: flutter packages pub run build_runner build --delete-conflicting-outputs

      - name: Configure Android release signing
        if: matrix.name == 'android' && github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/listlinker-release.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/listlinker-release.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties

      - name: Build ${{ matrix.name }}
        run: ${{ matrix.build-cmd }}

      - name: Verify Android release signature
        if: matrix.name == 'android' && github.event_name != 'pull_request'
        env:
          EXPECTED_CERT_SHA256: ${{ env.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk_path=build/app/outputs/flutter-apk/app-release.apk
          verification_output="$(
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
              --verbose --print-certs "$apk_path"
          )"
          legacy_verification_output="$(
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
              --min-sdk-version 23 --verbose --print-certs "$apk_path"
          )"
          printf '%s\n' "$verification_output"
          printf '%s\n' "$legacy_verification_output"
          grep -Fq 'Verified using v1 scheme (JAR signing): true' <<< "$legacy_verification_output"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' <<< "$verification_output"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' <<< "$verification_output"
          actual_cert_sha256="$(
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$verification_output"
          )"
          test "$actual_cert_sha256" = "$EXPECTED_CERT_SHA256"

      - name: Package macOS application
        if: matrix.name == 'macos'
        run: |
          test -d build/macos/Build/Products/Release/ListLinker.app
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/ListLinker.app \
            build/macos/ListLinker-macOS.zip
          test -s build/macos/ListLinker-macOS.zip

      - name: Package Windows application
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          Set-Location build/windows/x64/runner/Release
          7z a -tzip listlinker-windows.zip *
          if (-not (Test-Path listlinker-windows.zip)) { exit 1 }

      - name: Upload artifact
        if: matrix.name != 'android' || github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: listlinker-${{ matrix.name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
